version: "3.8"

# Umami — web analytics con dashboard público
# Arrancar: docker compose -f docker-compose.umami.yml up -d
# Panel admin: http://localhost:3001
# Usuario: admin / umami (cambiar inmediatamente)
# Después de levantar:
#   1. Ir a Settings → Websites → Add website → nebbuler.com
#   2. Copiar el Website ID → NEXT_PUBLIC_UMAMI_WEBSITE_ID
#   3. Configurar NEXT_PUBLIC_UMAMI_API_URL=http://tu-servidor:3001

services:
  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_secret}
      POSTGRES_DB: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secret}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-umami_app_secret_change_me}
      DISABLE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  umami_db_data:
