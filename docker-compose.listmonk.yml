version: "3.8"

# Listmonk — newsletter y email marketing
# Arrancar: docker compose -f docker-compose.listmonk.yml up -d
# Panel admin: http://localhost:9000
# Credenciales iniciales: admin / listmonk (cambiar inmediatamente)

services:
  listmonk-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD:-listmonk_secret}
      POSTGRES_DB: listmonk
    volumes:
      - listmonk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk"]
      interval: 10s
      timeout: 5s
      retries: 5

  listmonk:
    image: listmonk/listmonk:latest
    restart: unless-stopped
    depends_on:
      listmonk-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      LISTMONK_app__address: "0.0.0.0:9000"
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD:-listmonk_secret}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_app__admin_username: ${LISTMONK_ADMIN_USER:-admin}
      LISTMONK_app__admin_password: ${LISTMONK_ADMIN_PASSWORD:-listmonk_admin}
    volumes:
      - listmonk_uploads:/listmonk/uploads
    command: ["./listmonk", "--install", "--yes", "--config", ""]

volumes:
  listmonk_db_data:
  listmonk_uploads:
